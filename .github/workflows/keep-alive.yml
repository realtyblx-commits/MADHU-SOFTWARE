name: Supabase Health Check & Keep-Alive

# Scheduled every 3 days at 06:00 UTC (well within Supabase Free Plan's 7-day inactivity pause policy)
# Lightweight, read-only probe. No database writes, no storage uploads, no fake records.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  health-check:
    name: Ping Application & Supabase Health
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Perform Lightweight Read-Only Health Check
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://quqlutfkkydruoflbuil.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Starting scheduled low-frequency health check..."
          
          # 1. Probe deployed application health endpoint if configured
          if [ -n "$APP_HEALTH_URL" ]; then
            echo "Probing App Health Endpoint: $APP_HEALTH_URL"
            curl -sSf -m 20 "$APP_HEALTH_URL" || echo "App health endpoint returned non-200"
          fi

          # 2. Minimal direct Supabase REST probe (read 1 config ID, zero writes)
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Probing Supabase REST layer..."
            curl -sSf -m 20 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/company_settings?select=id&limit=1" \
              -o /dev/null -w "HTTP Status: %{http_code}\n"
          fi
          
          echo "Health check complete. Zero writes or side effects created."
