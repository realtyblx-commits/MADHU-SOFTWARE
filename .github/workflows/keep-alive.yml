name: Supabase Keep-Alive

# Every 5 minutes — independent of user traffic.
# Read-only REST probe (company_settings?select=id&limit=1). Zero writes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Ping Supabase (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run keep-alive probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Fallbacks if only VITE_* secrets were configured
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          set -euo pipefail

          # Default project URL when secret is empty (no keys inlined)
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then
            export SUPABASE_URL="https://eccoqnsmbebmumxuhhkv.supabase.co"
          fi

          echo "Running scripts/supabase-keep-alive.mjs ..."
          node scripts/supabase-keep-alive.mjs

          # Optional: also warm the deployed app health endpoint (still read-only)
          if [ -n "${APP_HEALTH_URL:-}" ]; then
            echo "Probing APP_HEALTH_URL (no secrets logged)..."
            curl -sS -m 20 -o /dev/null -w "App health HTTP %{http_code}\n" "$APP_HEALTH_URL" \
              || echo "App health endpoint unreachable (non-fatal)"
          fi
